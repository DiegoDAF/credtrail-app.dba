x-selfhost-env: &selfhost_env
  APP_ENV: production
  PLATFORM_DOMAIN: localhost
  PUBLIC_APP_ORIGIN: http://localhost:8787
  BETTER_AUTH_SECRET: replace-with-at-least-32-random-bytes
  BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:8787
  # Email is optional; SMTP credentials are independent of bucket credentials.
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-none}
  TRANSACTIONAL_EMAIL_FROM_ADDRESS: ${TRANSACTIONAL_EMAIL_FROM_ADDRESS:-}
  TRANSACTIONAL_EMAIL_FROM_NAME: ${TRANSACTIONAL_EMAIL_FROM_NAME:-CredTrail}
  TRANSACTIONAL_EMAIL_REPLY_TO: ${TRANSACTIONAL_EMAIL_REPLY_TO:-}
  ISSUANCE_EMAIL_BCC: ${ISSUANCE_EMAIL_BCC:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
  SMTP_AUTH: ${SMTP_AUTH:-login}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_PASSWORD_FILE: ${SMTP_PASSWORD_FILE:-}
  SMTP_TLS_CA_FILE: ${SMTP_TLS_CA_FILE:-}
  AWS_SES_REGION: ${AWS_SES_REGION:-}
  AWS_SES_CONFIGURATION_SET: ${AWS_SES_CONFIGURATION_SET:-}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your Postgres connection URL}
  STORAGE_BACKEND: s3
  # Use an existing AWS S3 or Cloudflare R2 bucket. See .env.selfhost.example.
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET to your existing S3 or R2 bucket}
  S3_REGION: ${S3_REGION:?Set S3_REGION to the AWS region or auto for R2}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID for your bucket}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY for your bucket}
  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your Postgres connection URL}
    command: ["node", "node_modules/@credtrail/db/scripts/migrate-postgres.mjs"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *selfhost_env
      PORT: "8787"
    ports:
      - "8787:8787"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/healthz/dependencies').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["node", "dist/node-runtime/node-worker-runtime.js"]
    environment:
      <<: *selfhost_env
      JOB_POLL_INTERVAL_MS: "1000"
